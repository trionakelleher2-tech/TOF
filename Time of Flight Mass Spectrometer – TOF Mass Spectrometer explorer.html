document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1.5; color: #3E4A5A; max-width: 820px\">By the end of the lesson you will be able to explain how a time of flight (TOF) mass spectrometer works and calculate relative atomic mass from mass-spectral data. Drag along the cross-section of the instrument, watch the ions travel through it, and click any numbered part.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #3E4A5A; background: #FFFFFF; border: 1px solid #D6DCE4; border-radius: 999px; padding: 8px 14px\">Ionisation → Acceleration → Ion drift → Detection · all under vacuum<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n\n<section aria-label=\"Interactive cross-section\" style=\"flex: 999 1 640px; min-width: 0; position: relative; height: 620px; border-radius: 18px; overflow: hidden; background: #0F141B; box-shadow: 0 1px 2px rgba(15,20,27,0.12)\">\n<canvas data-tof=\"1\" ref=\"{{ canvasRef }}\" aria-label=\"Cross-section of a time of flight mass spectrometer. Drag left or right to move along it, scroll to zoom, click a part to select it.\" role=\"img\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: ew-resize\"><\u002Fcanvas>\n\n<sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #C9D3DF; font-size: 15px; pointer-events: none\">Building the model…<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ glError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px; text-align: center; color: #E6ECF3; font-size: 15px; line-height: 1.5\">The interactive model could not start on this device. The stage cards and explanations below still work.<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"position: absolute; top: 16px; left: 16px; right: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; pointer-events: none\">\n<div style=\"display: flex; gap: 6px; pointer-events: auto\">\n<button type=\"button\" aria-label=\"Zoom in\" sc-camel-on-click=\"{{ zoomIn }}\" style=\"width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(15,20,27,0.78); color: #FFFFFF; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button type=\"button\" aria-label=\"Zoom out\" sc-camel-on-click=\"{{ zoomOut }}\" style=\"width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(15,20,27,0.78); color: #FFFFFF; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ resetView }}\" style=\"height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: rgba(15,20,27,0.78); color: #FFFFFF; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7\"><\u002Fpath><path d=\"M3 4v5h5\"><\u002Fpath><\u002Fsvg>Whole instrument<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px; pointer-events: none\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; pointer-events: auto\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #AEB9C7\">Ionisation method<\u002Fdiv>\n<div role=\"group\" aria-label=\"Ionisation method\" style=\"display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(15,20,27,0.78); border: 1px solid rgba(255,255,255,0.14)\">\n<button type=\"button\" aria-pressed=\"{{ isEI }}\" sc-camel-on-click=\"{{ setEI }}\" style=\"{{ btnEI }}\">Electron impact<\u002Fbutton>\n<button type=\"button\" aria-pressed=\"{{ isESI }}\" sc-camel-on-click=\"{{ setESI }}\" style=\"{{ btnESI }}\">Electrospray<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; padding: 8px 12px; border-radius: 12px; background: rgba(15,20,27,0.78); border: 1px solid rgba(255,255,255,0.14); color: #E6ECF3; font-size: 13px\">\n<span style=\"color: #AEB9C7\">Ions<\u002Fspan>\n<sc-for list=\"{{ isotopes }}\" as=\"iso\" hint-placeholder-count=\"3\">\n<span style=\"display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace\"><span style=\"{{ iso.dot }}\"><\u002Fspan>{{ iso.label }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 6px\">\n<div role=\"group\" aria-label=\"Speed\" style=\"display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 12px; background: rgba(15,20,27,0.78); border: 1px solid rgba(255,255,255,0.14)\">\n<span style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #AEB9C7; padding: 0 6px\">Speed<\u002Fspan>\n<sc-for list=\"{{ speeds }}\" as=\"spd\" hint-placeholder-count=\"3\">\n<button type=\"button\" aria-pressed=\"{{ spd.active }}\" sc-camel-on-click=\"{{ spd.pick }}\" style=\"{{ spd.style }}\">{{ spd.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ togglePlay }}\" style=\"height: 44px; min-width: 104px; padding: 0 16px; border-radius: 12px; border: 1px solid #FFFFFF; background: #FFFFFF; color: #0F141B; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px\"><sc-if value=\"{{ isPlaying }}\" hint-placeholder-val=\"{{ true }}\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"5\" width=\"4\" height=\"14\" rx=\"1\"><\u002Frect><\u002Fsvg><\u002Fsc-if><sc-if value=\"{{ isPaused }}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M7 5l12 7-12 7z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>{{ playLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 16px; right: 16px; top: 72px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none\">\n<div style=\"text-align: center; font-size: 13px; color: #AEB9C7\">{{ hint }}<\u002Fdiv>\n<sc-if value=\"{{ notStarted }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width: 560px; box-sizing: border-box; background: rgba(15,20,27,0.9); border: 2px solid #FFFFFF; border-radius: 12px; padding: 10px 16px; color: #FFFFFF; font-size: 15px; line-height: 1.45; text-align: center\">Press <strong>Play<\u002Fstrong> to send a sample through the mass spectrometer, one stage at a time.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ capH }}\" hint-placeholder-val=\"{{ false }}\">\n<div aria-live=\"polite\" style=\"{{ capStyle }}\">{{ capText }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ capIon }}\" hint-placeholder-val=\"{{ false }}\">\n<div aria-live=\"polite\" style=\"{{ capStyle }}\">{{ capText }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ capAcc }}\" hint-placeholder-val=\"{{ false }}\">\n<div aria-live=\"polite\" style=\"{{ capStyle }}\">{{ capText }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ capDrift }}\" hint-placeholder-val=\"{{ false }}\">\n<div aria-live=\"polite\" style=\"{{ capStyle }}\">{{ capText }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ capDet }}\" hint-placeholder-val=\"{{ false }}\">\n<div aria-live=\"polite\" style=\"{{ capStyle }}\">{{ capText }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<aside aria-live=\"polite\" style=\"flex: 1 1 360px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D6DCE4; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<span style=\"{{ infoBadge }}\">{{ info.n }}<\u002Fspan>\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #3E4A5A\">{{ info.stage }}<\u002Fspan>\n<\u002Fdiv>\n<h2 style=\"margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700\">{{ info.title }}<\u002Fh2>\n<sc-for list=\"{{ info.paras }}\" as=\"p\" hint-placeholder-count=\"2\">\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #232A33\">{{ p.t }}<\u002Fp>\n<\u002Fsc-for>\n<div style=\"background: #F3F6FA; border: 1px solid #D6DCE4; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3E4A5A\">{{ info.eqLabel }}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 17px; fon n leaves the acceleration region with the same kinetic energy, so heavier ions move more slowly and take longer to reach the detector. Pick a sample and change the kinetic energy or flight tube length to see the times change.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px\">\n<div style=\"flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3E4A5A\">Sample<\u002Fdiv>\n<div role=\"group\" aria-label=\"Sample\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{ samples }}\" as=\"sm\" hint-placeholder-count=\"3\">\n<button type=\"button\" aria-pressed=\"{{ sm.active }}\" sc-camel-on-click=\"{{ sm.pick }}\" style=\"{{ sm.style }}\">{{ sm.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"ke-range\" style=\"font-size: 14px; font-weight: 600\">Kinetic energy: <span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 500\">{{ keText }}<\u002Fspan><\u002Flabel>\n<input id=\"ke-range\" type=\"range\" min=\"1\" max=\"10\" step=\"0.5\" value=\"{{ ke }}\" sc-camel-on-change=\"{{ onKE }}\" style=\"width: 100%; height: 44px\">\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<label for=\"d-range\" style=\"font-size: 14px; font-weight: 600\">Flight tube length: <span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 500\">{{ dText }}<\u002Fspan><\u002Flabel>\n<input id=\"d-range\" type=\"range\" min=\"0.5\" max=\"2\" step=\"0.1\" value=\"{{ d }}\" sc-camel-on-change=\"{{ onD }}\" style=\"width: 100%; height: 44px\">\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"overflow-x: auto; border: 1px solid #D6DCE4; border-radius: 12px\">\n<sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 15px; min-width: 520px\">\n<sc-raw-thead>\n<sc-raw-tr style=\"background: #F3F6FA; text-align: left\">\n<sc-raw-th scope=\"col\" style=\"padding: 10px 14px; font-weight: 600\">Ion<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 10px 14px; font-weight: 600\">Mass of one ion / kg<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 10px 14px; font-weight: 600\">Speed / m s⁻¹<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"padding: 10px 14px; font-weight: 600\">Time of flight / s<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n<sc-raw-tr style=\"border-top: 1px solid #E3E8EE\">\n<sc-raw-td style=\"padding: 10px 14px; font-family: 'IBM Plex Mono', monospace\"><span style=\"display: inline-flex; align-items: center; gap: 8px\"><span style=\"{{ r.dot }}\"><\u002Fspan>{{ r.ion }}<\u002Fspan><\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 10px 14px; font-family: 'IBM Plex Mono', monospace\">{{ r.m }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 10px 14px; font-family: 'IBM Plex Mono', monospace\">{{ r.v }}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 10px 14px; font-family: 'IBM Plex Mono', monospace; font-weight: 600\">{{ r.t }}<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n\n<div style=\"background: #F3F6FA; border: 1px solid #D6DCE4; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3E4A5A\">Worked steps for the lightest ion<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; white-space: pre-line; color: #12161C\">{{ worked }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex 0; letter-spacing: 0.06em; text-transform: uppercase; color: #AEB9C7\">{{ arHeading }}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 15px; line-height: 1.5; color: #E6ECF3\">{{ arWorking }}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600\">{{ arResult }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"coach-h\" style=\"background: #FFFFFF; border: 1px solid #D6DCE4; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h2 id=\"coach-h\" style=\"margin: 0; font-size: 26px; font-weight: 700\">TOF calculation coach<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #3E4A5A; max-width: 860px\">Pick a calculation type. Try the question yourself and check your answer, then reveal the method one mark at a time. Press New question for fresh numbers.<\u002Fp>\n<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Calculation type\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{ calcTabs }}\" as=\"ct\" hint-placeholder-count=\"5\">\n<button type=\"button\" role=\"tab\" aria-selected=\"{{ ct.active }}\" sc-camel-on-click=\"{{ ct.pick }}\" style=\"{{ ct.style }}\">{{ ct.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px\">\n<div style=\"flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #3E4A5A\">{{ cq.tag }}<\u002Fdiv>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #12161C\">{{ cq.text }}<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-for list=\"{{ cq.givens }}\" as=\"gv\" hint-placeholder-count=\"3\">\n<span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding: 6px 10px; border-radius: 8px; background: #F3F6FA; border: 1px solid #D6DCE4\">{{ gv.t }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"font-size: 14px; color: #3E4A5A; font-family: 'IBM Plex Mono', monospace\">L = 6.022 × 10²³ mol⁻¹ · KE = ½mv² · v = d ÷ t<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px; flex: 1 1 240px; min-width: 0\">\n<label for=\"ans-in\" style=\"font-size: 14px; font-weight: 600\">Your answer ({{ cq.unit }})<\u002Flabel>\n<input id=\"ans-in\" type=\"text\" inputmode=\"decimal\" autocomplete=\"off\" placeholder=\"e.g. 1.43 or 2.81e-25\" value=\"{{ ans }}\" sc-camel-on-change=\"{{ onAns }}\" style=\"height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #8A96A6; font-size: 16px; font-family: 'IBM Plex Mono', monospace; color: #12161C; background: #FFFFFF; width: 100%\">\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ checkAns }}\" style=\"height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #12161C; background: #12161C; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">Check answer<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ hasFb }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"status\" style=\"{{ fbStyle }}\">{{ fbText }}<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ nextStep }}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #1F5FD6; background: #1F5FD6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">{{ nextLabel }}<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ showAll }}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B8C2CF; background: #FFFFFF; color: #12161C; font-size: 15px; font-weight: 600; cursor: pointer\">Show full method<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ newQ }}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B8C2CF; background: #FFFFFF; color: #12161C; font-size: 15px; font-weight: 600; cursor: pointer\">New question<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3E4A5A\">Method<\u002Fdiv>\n<sc-if value=\"{{ noSteps }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border: 1px dashed #B8C2CF; border-radius: 12px; padding: 18px; font-size: 15px; color: #3E4A5A\">Steps appear here one mark at a time.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-for list=\"{{ shownSteps }}\" as=\"stp\" hint-placeholder-count=\"2\">\n<div style=\"display: flex; gap: 12px; padding: 12px 14px; border: 1px solid #D6DCE4; border-radius: 12px; background: #F8FAFC\">\n<span style=\"flex: none; align-self: flex-start; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #163F8F; background: #E8EFFC; border-radius: 8px; padding: 4px 8px\">{{ stp.m }}<\u002Fspan>\n<div style=\"display: flex; flex-direction: column; gap: 4px; min-width: 0\">\n<div style=\"font-size: 15px; font-weight: 600; color: #12161C\">{{ stp.what }}<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #232A33; overflow-wrap: anywhere\">{{ stp.calc }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"background: #FFF6E5; border: 1px solid #E8C77E; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; color: #3D2C00\"><strong>Watch out: <\u002Fstrong>{{ cq.trap }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"qc-h\" style=\"background: #FFFFFF; border: 1px solid #D6DCE4; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<h2 id=\"qc-h\" style=\"margin: 0; font-size: 26px; font-weight: 700\">Quick check<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #3E4A5A\">Answer each one on a mini-whiteboard, then reveal.<\u002Fp>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleAllQ }}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #B8C2CF; background: #FFFFFF; color: #12161C; font-size: 15px; font-weight: 600; cursor: pointer\">{{ allQLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px\">\n<sc-for list=\"{{ quiz }}\" as=\"qz\" hint-placeholder-count=\"6\">\n<li style=\"border: 1px solid #D6DCE4; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; gap: 10px; align-items: flex-start\">\n<span style=\"flex: none; width: 28px; height: 28px; border-radius: 999px; background: #E8EFFC; color: #163F8F; display: inline-flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600\">{{ qz.n }}<\u002Fspan>\n<span style=\"font-size: 15px; font-weight: 600; line-height: 1.45; color: #12161C\">{{ qz.q }}<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ qz.open }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"font-size: 15px; line-height: 1.5; color: #0E4429; background: #E5F4EA; border-radius: 8px; padding: 8px 10px\">{{ qz.a }}<\u002Fdiv>\n<\u002Fsc-if>\n<button type=\"button\" aria-expanded=\"{{ qz.openStr }}\" sc-camel-on-click=\"{{ qz.toggle }}\" style=\"align-self: flex-start; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #B8C2CF; background: #FFFFFF; color: #12161C; font-size: 14px; font-weight: 600; cursor: pointer\">{{ qz.btn }}<\u002Fbutton>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fsection>\n\n<section aria-labelledby=\"vocab-h\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<h2 id=\"vocab-h\" style=\"margin: 0; font-size: 26px; font-weight: 700\">Key vocabulary<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px\">\n<sc-for list=\"{{ glossary }}\" as=\"g\" hint-placeholder-count=\"6\">\n<div style=\"background: #FFFFFF; border: 1px solid #D6DCE4; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 16px; font-weight: 700; color: #12161C\">{{ g.term }}<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.5; color: #3E4A5A\">{{ g.def }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<h3 style=\"margin: 12px 0 0 0; font-size: 20px; font-weight: 700\">Command words<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px\">\n<sc-for list=\"{{ commandWords }}\" as=\"cw\" hint-placeholder-count=\"4\">\n<div style=\"background: #12161C; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px\">\n<div style=\"font-size: 16px; font-weight: 700; color: #FFFFFF\">{{ cw.term }}<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.5; color: #D5DDE7\">{{ cw.def }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:3400}}\">\nclass Component extends DCLogic {\n  constructor(...a) {\n    super(...a);\n    var sv = (this.props && this.props.startView) || '3d';\n    this.state = Object.assign({}, this.state || {}, {\n      mode: 'cut', method: 'ei', sel: 'source', sample: 'ne',\n      playing: false, ke: 4, d: 1.5, ready: false, glError: false,\n      calcType: 'time', seed: 0, stepN: 0, ans: '', fb: null, qOpen: {}, panX: -5.1, cap: 'ion', slow: false, speed: 1, follow: true, started: false\n    });\n    this._canvas = null;\n    this.canvasRef = (el) => {\n      if (!el) return;\n      if (el !== this._canvas) {\n        if (this._inited) this.teardown();\n        this._canvas = el;\n        this.tryInit();\n      }\n    };\n  }\n\n  // ---------- data ----------\n  samplesData() {\n    if (this._sd) return this._sd;\n    var I = function (pairs) { return pairs.map(function (p) { return { mz: p[0], ab: p[1], lab: p[2] }; }); };\n    this._sd = {\n      ne: { name: 'Neon', sym: 'Ne', iso: I([[20, 90.5], [21, 1.0], [22, 8.5]]) },\n      o: { name: 'Oxygen', sym: 'O', iso: I([[16, 99.757], [17, 0.038], [18, 0.205]]) },\n      mg: { name: 'Magnesium', sym: 'Mg', iso: I([[24, 79.0], [25, 10.0], [26, 11.0]]) },\n      b: { name: 'Boron', sym: 'B', iso: I([[10, 19.9], [11, 80.1]]) },\n      li: { name: 'Lithium', sym: 'Li', iso: I([[6, 7.6], [7, 92.4]]) },\n      cl: { name: 'Chlorine', sym: 'Cl', iso: I([[35, 75.0], [37, 25.0]]) },\n      cu: { name: 'Copper', sym: 'Cu', iso: I([[63, 69.2], [65, 30.8]]) },\n      ga: { name: 'Gallium', sym: 'Ga', iso: I([[69, 60.2], [71, 39.8]]) },\n      br: { name: 'Bromine', sym: 'Br', iso: I([[79, 50.7], [81, 49.3]]) },\n      ti: { name: 'Titanium', sym: 'Ti', iso: I([[46, 9.1], [47, 7.8], [48, 74.6], [49, 8.5]]) },\n      kr: { name: 'Krypton', sym: 'Kr', iso: I([[78, 0.4], [80, 2.3], [82, 11.6], [83, 11.5], [84, 57.0], [86, 17.3]]) },\n      cl2: { name: 'Cl₂ molecule', sym: 'Cl₂', mol: true, iso: I([[70, 56.25, '³⁵Cl₂⁺'], [72, 37.5, '³⁵Cl³⁷Cl⁺'], [74, 6.25, '³⁷Cl₂⁺']]) },\n      br2: { name: 'Br₂ molecule', sym: 'Br₂', mol: true, iso: I([[158, 25.7, '⁷⁹Br₂⁺'], [160, 50.0, '⁷⁹Br⁸¹Br⁺'], [162, 24.3, '⁸¹Br₂⁺']]) }\n    };\n    return this._sd;\n  }\n  colors() { return ['#F5B83D', '#46C2E8', '#E25DA8', '#7BD389', '#B48CF2', '#FF7A45']; }\n  stageColor(id) { return ({ source: '#8E9BDB', accel: '#D63CD6', tube: '#2BD67B', detector: '#E3A86B', computer: '#E3A86B', vacuum: '#7FB2F5' })[id] || '#8E9BDB'; }\n  partX(id) { return ({ source: -5.8, accel: -3.2, tube: 1.6, detector: 6.5, computer: 9.4, vacuum: 1.6 })[id]; }\n  sup(n) {\n    var m = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };\n    return String(n).split('').map(function (c) { return m[c] || c; }).join('');\n  }\n  sci(x) {\n    if (!isFinite(x) || x === 0) return '0';\n    var e = Math.floor(Math.log10(Math.abs(x)));\n    var mnt = x / Math.pow(10, e);\n    if (Math.abs(mnt) >= 9.995) { mnt = mnt / 10; e += 1; }\n    if (e === 0) return mnt.toFixed(2);\n    return mnt.toFixed(2) + ' × 10' + this.sup(e);\n  }\n  isoList() {\n    var s = this.samplesData()[this.state.sample];\n    var cols = this.colors();\n    var self = this;\n    return s.iso.map(function (it, i) { return { mz: it.mz, ab: it.ab, color: cols[i % cols.length], sym: s.sym, lab: it.lab || (self.sup(it.mz) + s.sym + '⁺') }; });\n  }\n  sciN(x, sf) {\n    if (!isFinite(x) || x === 0) return '0';\n    var e = Math.floor(Math.log10(Math.abs(x)));\n    var mnt = x / Math.pow(10, e);\n    var lim = 10 - 0.5 * Math.pow(10, 1 - sf);\n    if (Math.abs(mnt) >= lim) { mnt = mnt / 10; e += 1; }\n    if (e === 0) return mnt.toFixed(sf - 1);\n    return mnt.toFixed(sf - 1) + ' × 10' + this.sup(e);\n  }\n  rng(seed) {\n    var a = ((seed + 1) * 2654435761) >>> 0;\n    return function () {\n      a = (a + 0x6D2B79F5) | 0;\n      var t = Math.imul(a ^ (a >>> 15), 1 | a);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n  genQ(type, seed) {\n    var self = this, L = 6.022e23, R = this.rng(seed * 7 + type.length);\n    var S = function (x, sf) { return self.sciN(x, sf || 3); };\n    var r3 = function (x) { return parseFloat(x.toPrecision(3)); };\n    var pick = function (arr) { return arr[Math.floor(R() * arr.length)]; };\n    var kePick = function () { return r3((1 + R() * 8.9) * Math.pow(10, pick([-16, -16, -15]))); };\n    var dPick = function () { return Math.round((0.6 + R() * 1.4) * 100) / 100; };\n    var lab = function (mz, sym) { return self.sup(mz) + sym + '⁺'; };\n    var ions = [[24, 'Mg'], [35, 'Cl'], [40, 'Ar'], [48, 'Ti'], [52, 'Cr'], [63, 'Cu'], [69, 'Ga'], [79, 'Br'], [84, 'Kr'], [88, 'Sr'], [20, 'Ne']];\n    var ex = seed === 0;\n    var q = { tag: ex ? 'Worked example' : 'Practice question ' + seed };\n    if (type === 'time') {\n      var io = ex ? [35, 'Cl'] : pick(ions), d = ex ? 1.50 : dPick(), KE = ex ? 3.20e-16 : kePick();\n      var m = io[0] / 1000 / L, v = Math.sqrt(2 * KE / m), t = d / v;\n      q.text = 'A ' + lab(io[0], io[1]) + ' ion is accelerated to a kinetic energy of ' + S(KE) + ' J. It travels along a flight tube of length ' + d.toFixed(2) + ' m. Calculate the time of flight of the ion.';\n      q.givens = ['KE = ' + S(KE) + ' J', 'd = ' + d.toFixed(2) + ' m', 'ion: ' + lab(io[0], io[1])];\n      q.steps = [\n        ['M1', 'Mass of ONE ion in kg', 'm = (' + io[0] + ' ÷ 1000) ÷ 6.022 × 10²³ = ' + S(m, 4) + ' kg'],\n        ['M2', 'Rearrange KE = ½mv² for speed', 'v = √(2KE ÷ m) = √(2 × ' + S(KE) + ' ÷ ' + S(m, 4) + ')'],\n        ['M3', 'Calculate the speed', 'v = ' + S(v, 4) + ' m s⁻¹'],\n        ['M4', 'Time = distance ÷ speed', 't = d ÷ v = ' + d.toFixed(2) + ' ÷ ' + S(v, 4) + ' = ' + S(t) + ' s']\n      ];\n      q.answer = t; q.unit = 's'; q.sf = 3;\n      q.trap = 'The mass must be in kg for ONE ion — divide by 1000 and by the Avogadro constant. Using grams makes the time about 32 times too big.';\n    } else if (type === 'length') {\n      var io2 = ex ? [84, 'Kr'] : pick(ions), KE2 = ex ? 4.83e-16 : kePick();\n      var m2 = io2[0] / 1000 / L, v2 = Math.sqrt(2 * KE2 / m2);\n      var t2 = ex ? 1.72e-5 : r3(dPick() / v2);\n      var d2 = v2 * t2;\n      if (ex) q.tag = 'Example from the lesson (WE DO)';\n      q.text = 'In a TOF mass spectrometer, each ' + lab(io2[0], io2[1]) + ' ion is accelerated to a kinetic energy of ' + S(KE2) + ' J and the time of flight is ' + S(t2) + ' s. Calculate the length, in metres, of the flight tube.';\n      q.givens = ['KE = ' + S(KE2) + ' J', 't = ' + S(t2) + ' s', 'ion: ' + lab(io2[0], io2[1])];\n      q.steps = [\n        ['M1', 'Mass of ONE ion in kg', 'm = (' + io2[0] + ' ÷ 1000) ÷ 6.022 × 10²³ = ' + S(m2, 4) + ' kg'],\n        ['M2', 'Rearrange KE = ½mv² for speed', 'v² = 2KE ÷ m = 2 × ' + S(KE2) + ' ÷ ' + S(m2, 4) + ' = ' + S(v2 * v2, 4)],\n        ['M3', 'Square root to find the speed', 'v = ' + S(v2, 4) + ' m s⁻¹'],\n        ['M4', 'Length = speed × time', 'd = v × t = ' + S(v2, 4) + ' × ' + S(t2) + ' = ' + d2.toFixed(2) + ' m']\n      ];\n      q.answer = d2; q.unit = 'm'; q.sf = 3;\n      q.trap = 'Rearrange carefully: d = v × t, not v ÷ t. A flight tube is usually between about 0.5 m and 3 m — if your answer is tiny, check you converted the mass to kg.';\n    } else if (type === 'mr' || type === 'esi') {\n      var esi = type === 'esi';\n      var Mn = ex ? (esi ? 180 : 169.3) : pick(esi ? [120, 151, 180, 194, 206, 256, 302] : [44, 58, 72, 86, 100, 114, 128, 142, 156]);\n      var Mion = esi ? Mn + 1 : Mn;\n      var d3 = ex ? (esi ? 1.00 : 1.50) : dPick(), KE3 = ex ? (esi ? 2.00e-16 : 2.09e-15) : kePick();\n      var t3 = ex && !esi ? 1.23e-5 : r3(d3 * Math.sqrt((Mion / 1000 / L) / (2 * KE3)));\n      var v3 = d3 / t3, m3 = 2 * KE3 / (v3 * v3), molKg = m3 * L, molG = molKg * 1000;\n      if (ex && !esi) q.tag = 'Example from the lesson (WE DO)';\n      q.text = esi\n        ? 'Compound X is dissolved in a polar, volatile solvent and ionised by electrospray ionisation. Each ion is accelerated to a kinetic energy of ' + S(KE3) + ' J. The time of flight along the ' + d3.toFixed(2) + ' m flight tube is ' + S(t3) + ' s. Determine the mass, in g, of one mole of X.'\n        : 'A molecule Q is ionised by electron impact. The Q⁺ ion has a kinetic energy of ' + S(KE3) + ' J and takes ' + S(t3) + ' s to reach the detector. The flight tube is ' + d3.toFixed(2) + ' m long. Calculate the relative molecular mass of Q.';\n      q.givens = ['KE = ' + S(KE3) + ' J', 't = ' + S(t3) + ' s', 'd = ' + d3.toFixed(2) + ' m'];\n      q.steps = [\n        ['M1', 'Speed from distance and time', 'v = d ÷ t = ' + d3.toFixed(2) + ' ÷ ' + S(t3) + ' = ' + S(v3, 4) + ' m s⁻¹'],\n        ['M2', 'Rearrange KE = ½mv² for mass', 'm = 2KE ÷ v²'],\n        ['M3', 'Mass of one ion in kg', 'm = 2 × ' + S(KE3) + ' ÷ (' + S(v3, 4) + ')² = ' + S(m3, 4) + ' kg'],\n        ['M4', 'Multiply by L for one mole', S(m3, 4) + ' × 6.022 × 10²³ = ' + molKg.toFixed(4) + ' kg mol⁻¹'],\n        ['M5', 'Convert kg to g', molKg.toFixed(4) + ' × 1000 = ' + molG.toFixed(1) + (esi ? ' g mol⁻¹ (this is MH⁺)' : ' g mol⁻¹, so Mr = ' + molG.toFixed(0))]\n      ];\n      if (esi) q.steps.push(['M6', 'Subtract 1 for the added H⁺', molG.toFixed(1) + ' − 1 = ' + (molG - 1).toFixed(1) + ' g']);\n      q.answer = esi ? molG - 1 : molG; q.unit = esi ? 'g' : 'no units'; q.sf = esi ? 4 : 3; q.esi = esi;\n      q.trap = esi\n        ? 'Electrospray adds H⁺, so the ion is MH⁺. Subtract 1 at the end to get the mass of one mole of X.'\n        : 'Electron impact forms Q⁺ by losing an electron, so nothing is subtracted. Mr has no units.';\n    } else {\n      var pairs = [[49, 47, 'Ti'], [79, 81, 'Br'], [82, 86, 'Kr'], [35, 37, 'Cl'], [52, 50, 'Cr'], [63, 65, 'Cu'], [121, 123, 'Sb']];\n      var pr = ex ? [49, 47, 'Ti'] : pick(pairs);\n      var sf = ex ? 4 : 3;\n      var tA = ex ? 9.816e-7 : r3((1 + R() * 8.9) * Math.pow(10, pick([-6, -5, -4])));\n      var rt = Math.sqrt(pr[1] / pr[0]), tB = tA * rt;\n      if (ex) q.tag = 'Example from the lesson (WE DO)';\n      q.text = 'In the same spectrometer, under the same conditions, a ' + lab(pr[0], pr[2]) + ' ion takes ' + S(tA, sf) + ' s to reach the detector. Calculate the time of flight of the ' + lab(pr[1], pr[2]) + ' ion. Give your answer to ' + sf + ' significant figures.';\n      q.givens = ['t(' + lab(pr[0], pr[2]) + ') = ' + S(tA, sf) + ' s', 'same KE', 'same d'];\n      q.steps = [\n        ['M1', 'Same KE and same tube, so t ∝ √m', 't₂ ÷ t₁ = √(m₂ ÷ m₁)'],\n        ['M2', 'Rearrange for the unknown time', 't₂ = t₁ × √(' + pr[1] + ' ÷ ' + pr[0] + ') = ' + S(tA, sf) + ' × ' + rt.toFixed(5)],\n        ['M3', 'Calculate and round', 't₂ = ' + S(tB, sf) + ' s']\n      ];\n      q.answer = tB; q.unit = 's'; q.sf = sf;\n      q.trap = 'No need to convert to kg — the masses are in a ratio, so the units cancel. Check: the heavier ion must take longer.';\n    }\n    return q;\n  }\n  parseAns(s) {\n    if (s === null || s === undefined) return NaN;\n    var supd = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };\n    var t = String(s).trim().replace(/\\s+/g, '').replace(/[−–]/g, '-').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g, function (c) { return supd[c]; });\n    t = t.replace(/(kgmol-1|gmol-1|kg|ms-1|m|s|g)$/i, '');\n    t = t.replace(/[x×*]10\\^?/i, 'e').replace(/,/g, '');\n    var v = Number(t);\n    return isFinite(v) ? v : NaN;\n  }\n  quizData() {\n    return [\n      ['Name the two methods of ionisation.', 'Electron impact and electrospray ionisation.'],\n      ['Why must the sample be ionised?', 'Only charged particles can be accelerated by the electric field and produce a current at the detector.'],\n      ['Write an equation for the electron impact ionisation of magnesium.', 'Mg(g) → Mg⁺(g) + e⁻'],\n      ['In electrospray ionisation, what does each molecule gain?', 'A proton (H⁺), forming XH⁺. The peak is at m/z = Mr + 1.'],\n      ['After acceleration, what is the same for every ion?', 'Kinetic energy.'],\n      ['Why do the ions have different speeds after acceleration?', 'They have different masses — same KE, so lighter ions move faster.'],\n      ['Which ions reach the detector first?', 'The lightest ions (smallest m/z), because they travel fastest.'],\n      ['At the detector, the size of the current is proportional to the…', 'Abundance of the ion (how many ions arrive).'],\n      ['Why is the spectrometer kept under a vacuum?', 'So that ions do not collide with air molecules.'],\n      ['Calculate the mass, in kg, of one ¹²C atom.', '0.012 ÷ 6.022 × 10²³ = 1.99 × 10⁻²⁶ kg'],\n      ['Calculate Ar for chlorine: 75% ³⁵Cl and 25% ³⁷Cl.', '[(35 × 75) + (37 × 25)] ÷ 100 = 35.5'],\n      ['Why does Cl₂ give peaks at m/z 70, 72 and 74?', '³⁵Cl³⁵Cl, ³⁵Cl³⁷Cl and ³⁷Cl³⁷Cl molecular ions, in the ratio 9 : 6 : 1.']\n    ];\n  }\n  commandWordsData() {\n    return [\n      ['Calculate', 'Work out a numerical answer, showing your method clearly step by step.'],\n      ['Determine', 'Use the given data or equations to work out a value — same expectation as calculate.'],\n      ['Describe', 'Say what happens, in order, using the correct key terms (ionisation → acceleration → ion drift → detection).'],\n      ['Explain', 'Give the reasons why — e.g. same KE, so lighter ions travel faster and arrive first.']\n    ].map(function (g) { return { term: g[0], def: g[1] }; });\n  }\n  partInfo(id) {\n    var ei = this.state.method === 'ei';\n    var P = {\n      source: ei ? {\n        n: '1', stage: 'Stage 1 · Ionisation', title: 'Electron impact ionisation',\n        paras: ['The gaseous sample passes into the ionisation chamber. An electron gun (a hot wire filament) fires high-energy electrons across it towards a positive plate.',\n          'Each collision knocks one electron off a particle, forming a 1+ ion (loss of an electron).',\n          'The sample must be ionised because only charged particles can be accelerated by the electric field and produce a current at the detector.'],\n        eqLabel: 'Equation', eq: 'X(g) → X⁺(g) + e⁻',\n        tip: 'Used for elements and substances with a low formula = true; io.phase = 'ionised';\n  }\n  spawnBunch() {\n    var T = window.THREE, self = this;\n    var isos = this.isoList();\n    var N = 12;\n    var mMin = Math.min.apply(null, isos.map(function (i) { return i.mz; }));\n    var esi = this.state.method === 'esi';\n    var list = [];\n    isos.forEach(function (it, idx) {\n      var cnt = Math.max(1, Math.round(it.ab / 100 * N));\n      for (var k = 0; k < cnt; k++) list.push({ it: it, idx: idx });\n    });\n    for (var s = list.length - 1; s > 0; s--) { var j = Math.floor(Math.random() * (s + 1)); var tmp = list[s]; list[s] = list[j]; list[j] = tmp; }\n    this._ions.forEach(function (io) { self._fx.remove(io.mesh); });\n    this._fxp.forEach(function (p) { self._fx.remove(p.mesh); });\n    this._fxp = [];\n    this._waters.forEach(function (w) { self._fx.remove(w); });\n    this._waters = []; this._timers = [];\n    this._released = false;\n    if (esi) { for (var we = 0; we < 5; we++) this._timers.push({ t: 0.3 + we * 0.5, fn: function () { self.waterEvent(); } }); }\n    this._ions = list.map(function (o, k) {\n      var mesh = new T.Mesh(self._ionGeo, self._neutralMat);\n      var plus = self.spr(self._plusMat, 0.16, 0.11); plus.visible = false; mesh.add(plus);\n      var y = (Math.random() - 0.5) * 0.55, z = (Math.random() - 0.5) * 0.55;\n      var drop = null, hp = null;\n      if (esi) {\n        mesh.position.set(-5.35, 0, 0);\n        drop = new T.Mesh(self._dropShellGeo, self._dropShellMat); mesh.add(drop);\n        hp = new T.Mesh(self._eGeo, self._hMat); hp.position.set(0.13, 0.09, 0); hp.add(self.spr(self._hLabMat, 0.17, 0.09)); mesh.add(hp);\n      } else mesh.position.set(-6.5, y, z);\n      mesh.visible = false;\n      self._fx.add(mesh);\n      return {\n        mesh: mesh, plus: plus, drop: drop, hp: hp, mat: self._ionMats[o.idx % self._ionMats.length],\n        v: 3.6 * Math.pow(mMin / o.it.mz, 3.2), sp: 0, a: 0,\n        phase: 'wait0', delay: (esi ? 3.4 : 0) + k * 0.22 + Math.random() * 0.08, y0: y, z0: z,\n        holdX: -4.55 + (Math.random() - 0.5) * 0.25, esi: esi, done: false\n      };\n    });\n  }\n  updateIons(dtA) {\n    var T = window.THREE, self = this;\n    var V = function (x, y, z) { return new T.Vector3(x, y, z); };\n    var ions = this._ions;\n    for (var ti = this._timers.length - 1; ti >= 0; ti--) {\n      var tm = this._timers[ti]; tm.t -= dtA;\n      if (tm.t <= 0) { this._timers.splice(ti, 1); tm.fn(); }\n    }\n    for (var k = 0; k < ions.length; k++) {\n      var io = ions[k];\n      if (io.done) continue;\n      var p = io.mesh.position;\n      if (io.phase === 'wait0') {\n        io.delay -= dtA;\n        if (io.delay <= 0) { io.phase = 'in'; io.mesh.visible = true; }\n      } else if (io.phase === 'in') {\n        if (io.esi) {\n          p.x += 0.7 * dtA;\n          var f = Math.min(1, (p.x + 5.35) / 0.45);\n          p.y = io.y0 * f; p.z = io.z0 * f;\n          if (io.drop) { var ds = Math.max(0.35, 1 - f * 0.65); io.drop.scale.set(ds, ds, ds); }\n          if (p.x >= -4.9) {\n            p.x = -4.9; io.phase = 'hit';\n            if (io.drop) { io.mesh.remove(io.drop); io.drop = null; }\n            var hpWorld = p.clone().add(io.hp.position);\n            io.mesh.remove(io.hp); io.hp = null;\n            (function (ion) {\n              self.fly(hpWorld, ion.mesh.position.clone(), 0.35, self._hMat, self._hLabMat, function () { self.ionise(ion); });\n            })(io);\n          }\n        } else {\n          p.x += 1.3 * dtA;\n          if (p.x >= -5.1) {\n            p.x = -5.1; io.phase = 'hit';\n            (function (ion) {\n              var pos = ion.mesh.position.clone();\n              self.fly(V(-5.1, -1.1, pos.z), pos, 0.4, self._eMat, null, function () {\n                self.ionise(ion);\n                self.fly(pos, V(-5.0, 0.98, pos.z), 0.55, self._eMat, null, null);\n                self.fly(pos, V(-4.55, 0.98, pos.z + 0.15), 0.6, self._eMat, self._eLabMat, null);\n              });\n            })(io);\n          }\n        }\n      } else if (io.phase === 'ionised') {\n        var dx = io.holdX - p.x;\n        p.x += Math.sign(dx) * Math.min(Math.abs(dx), 0.9 * dtA);\n        if (Math.abs(dx) < 0.01) io.phase = 'ready';\n      } else if (io.phase === 'accel' || io.phase === 'drift') {\n        if (p.x < -2.85) io.sp = Math.min(io.v, io.sp + io.a * dtA); else { io.sp = io.v; io.phase = 'drift'; }\n        p.x += io.sp * dtA;\n        var g = Math.max(0, Math.min(1, (p.x + 2.85) / 3));\n        p.y = io.y0 * (1 - g * 0.8); p.z = io.z0 * (1 - g * 0.8);\n        if (p.x >= 6.2) {\n          p.x = 6.2; io.phase = 'det'; this._flash = 1;\n          (function (ion) {\n            var pos = ion.mesh.position.clone();\n            self.fly(V(6.32, pos.y + 0.35, pos.z), pos, 0.4, self._eMat, self._eLabMat, function () {\n              ion.mesh.material = self._neutralMat; ion.plus.visible = false; ion.phase = 'fade'; ion.ft = 0;\n            });\n          })(io);\n        }\n      } else if (io.phase === 'fade') {\n        io.ft += dtA;\n        var sc = Math.max(0.01, 1 - io.ft / 0.7);\n        io.mesh.scale.set(sc, sc, sc);\n        if (io.ft >= 0.7) { io.done = true; io.mesh.visible = false; }\n      }\n    }\n    if (!this._released && ions.length && ions.every(function (io) { return io.phase === 'ready'; })) {\n      this._released = true;\n      ions.forEach(function (io) {\n        io.phase = 'accel'; io.sp = 0;\n        io.a = io.v * io.v / (2 * Math.max(0.4, -2.85 - io.mesh.position.x));\n      });\n    }\n    for (var q = this._fxp.length - 1; q >= 0; q--) {\n      var fp = this._fxp[q];\n      fp.t += dtA / fp.dur;\n      fp.mesh.position.lerpVectors(fp.from, fp.to, Math.min(1, fp.t));\n      if (fp.t >= 1) {\n        this._fx.remove(fp.mesh); this._fxp.splice(q, 1);\n        if (fp.onDone) fp.onDone();\n      }\n    }\n    // caption for the stage that is happening now\n    var cap = (!ions.length && this.state.method === 'esi') ? 'h' : 'ion';\n    if (!this._r
